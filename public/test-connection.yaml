openapi: 3.0.3
info:
  title: Test Connection
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8000/api

paths:
  /ping:
    get:
      summary: Test Connection
      tags:
        - TestConnection
      responses:
        '200':
          description: Connection Successed

  /ping-auth:
    get:
      summary: Test Connection
      tags:
        - TestConnection
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Connection Successed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
